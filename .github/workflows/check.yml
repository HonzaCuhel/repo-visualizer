name: Check skill
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  core:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.10', '3.12', '3.14']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m unittest discover -s tests -v
      - run: python scripts/package_skill.py
  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install uv==0.13.6
      - run: uv sync --locked --extra export
      - run: uv run --locked --extra export python -m playwright install --with-deps chromium
      - name: Locate the installed browser
        run: |
          uv run --locked --extra export python - <<'PY'
          import os
          from playwright.sync_api import sync_playwright
          with sync_playwright() as p:
              with open(os.environ['GITHUB_ENV'], 'a') as output:
                  output.write('REPO_VISUALIZER_BROWSER=' + p.chromium.executable_path + '\n')
          PY
      - run: uv run --locked --extra export python -m unittest discover -s tests -v
      - run: python scripts/build_site.py
      - run: python scripts/package_skill.py
