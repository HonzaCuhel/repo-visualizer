name: Publish release
on:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s tests -v
      - run: python scripts/package_skill.py
      - name: Verify packaged download matches the release
        run: |
          cmp dist/repo-visualizer.zip site/downloads/repo-visualizer.zip
          (cd site/downloads && sha256sum -c SHA256SUMS.txt)
      - name: Publish tagged artifacts
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          gh release create "$RELEASE_TAG" \
            dist/repo-visualizer.zip site/downloads/SHA256SUMS.txt \
            'site/codex-agent-loop.html#explorer.html' \
            site/media/walkthrough.gif site/media/walkthrough.mp4 \
            --verify-tag --title "$RELEASE_TAG — Source-grounded repository graphs" \
            --notes-file "docs/releases/$RELEASE_TAG.md"
